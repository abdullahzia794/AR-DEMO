<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Menu Demo</title>

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    h1 {
      margin: 25px 0 5px;
    }

    p {
      color: #666;
    }

    model-viewer {
      width: 100%;
      height: 70vh;
      background: #eeeeee;
    }

    .ar-button {
      background: #d71920;
      color: white;
      border: none;
      border-radius: 25px;
      padding: 12px 22px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>🍔 Burger Menu</h1>

  <p>3D Preview & AR Experience</p>

  <model-viewer
    src="burger_kings_avocado_whopper%20%282%29.glb"
    alt="Burger 3D Model"
    camera-controls
    auto-rotate
    ar
    shadow-intensity="1">

    <button
      class="ar-button"
      slot="ar-button">
      View in AR
    </button>

  </model-viewer>

</body>
</html>
